<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You 💝</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for the finale -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Animated Background Layer -->
    <div class="bg-layer" id="bg-layer"></div>
    <div id="dark-overlay" class="dark-overlay"></div>

    <!-- Floating Music Player -->
    <div id="music-player" class="music-player">
        <audio id="bg-music">
            <source src="music.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <div class="player-content">
            <div class="disc-container">
                <div class="vinyl-disc"></div>
                <div class="music-note">🎵</div>
            </div>
            <div class="track-info">
                <span class="track-title">Playing for you...</span>
                <span class="track-status" id="track-status">Tap to play 💖</span>
            </div>
            <div class="controls">
                <button id="play-pause-btn" class="control-btn" aria-label="Play/Pause">
                    <svg viewBox="0 0 24 24" class="play-icon active">
                        <path fill="currentColor" d="M8 5v14l11-7z"/>
                    </svg>
                    <svg viewBox="0 0 24 24" class="pause-icon">
                        <path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="card" id="main-card">

        <!-- Loading / Intro Screen -->
        <section id="intro-screen" class="screen active">
            <div class="envelope">
                <div class="envelope-heart">💌</div>
            </div>
            <h2 class="fade-in-text">I have a question for you...</h2>
            <button id="open-btn" class="glass-btn mt-2 fade-in-delayed">Open it</button>
        </section>

        <!-- The Question Screen -->
        <section id="question-screen" class="screen hidden">
            <div class="media-container">
                <img id="main-gif" class="active" src="gifs/cute-bear-silvia-emoji-gif-z0343wle1ch6vs3x.gif" alt="Cute bears looking up">
            </div>
            <h1 class="question-text">Do you love me? 🥺</h1>
            <p class="subtitle" id="subtitle">Be honest...</p>

            <div class="buttons-container">
                <button id="yes-btn" class="primary-btn">
                    <span class="btn-text">Of course I do 💖</span>
                    <div class="btn-glow"></div>
                </button>
                <button id="no-btn" class="secondary-btn">
                    <span>No</span>
                </button>
            </div>
        </section>

        <!-- The Success Screen -->
        <section id="success-screen" class="screen hidden">
            <div class="media-container">
                <img id="success-gif" class="active" src="gifs/bear-kiss-bear-kisses.gif" alt="Happy kissing bears">
            </div>
            <h1 class="success-text">Yay! I knew it! 🥰</h1>
            <p class="success-message">You just made my entire day.<br>I love you too! ❤️</p>
        </section>

        <!-- The Sad/Easter Egg Screen -->
        <section id="sad-screen" class="screen hidden">
            <div class="media-container sad-container">
                <img id="sad-gif" class="active" src="gifs/milk-and-mocha-alone-genrma4r1r6wstl9.gif" alt="Sad bear">
            </div>
            <h1 class="sad-text" id="sad-dialogue"></h1>
            <p class="subtitle mt-2" style="margin-bottom: 20px;">The music faded before we did...</p>
            <button id="restart-btn" class="glass-btn" style="opacity: 0; transition: opacity 2s ease; visibility: hidden; pointer-events: none;">Rewind Time</button>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
